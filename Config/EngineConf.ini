; Core engine config example
[Engine]
WindowWidth=1920
WindowHeight=1080
; The text shown in the window title bar! 
WindowTitle=Fling Engine
; Will show what git branch and commit head in the title bar
DisplayBuildInfoInTitle=true
DisplayVersionInfoInTitle=true

; How a run ticks and shows its frames (RunSettings, Docs/time-and-ticks.md). A launch
; flag overrides each key. Left out, or with no value, a key takes its default.
;   Exec    How play runs: threaded (default: ticks on a game thread), direct or inline.
;           Edit mode in the editor always runs on one thread. Flag: --exec
;   SimHz   The fixed simulation rate in ticks a second, 1 to 1000 (default 30). It
;           changes only at a tick boundary (GPU Options); recordings replay only at the
;           rate they were recorded at. Flag: --sim-hz
;   MaxFps  At most this many frames a second on the main thread, 1 to 1000, or 0 for
;           no cap. Default: the refresh rate of the window's monitor, else 60; no cap
;           with --null-render. Flag: --max-fps
;   VSync   on (default): present waits for the display's refresh (FIFO). off: frames do
;           not wait and may tear, for the lowest latency (IMMEDIATE, else MAILBOX, else
;           FIFO). With VSync on, a MaxFps at or above the refresh rate is left to the
;           display. Flag: --vsync
;   Interpolation
;           on (default): the renderer draws between the latest two ticks; off: the
;           latest tick only. Presentation only. Flag: --interpolation
;   FrustumCulling
;           on (default): the renderer skips the meshes outside the camera's view;
;           off: it draws every mesh. Presentation only. Flag: --frustum-culling
; Every key here is checked in every run, also when a flag overrides it. The editor's
; GPU Options window changes SimHz, MaxFps, VSync, Interpolation and FrustumCulling at
; run time.
;Exec=threaded
;SimHz=30
;MaxFps=
;VSync=on
;Interpolation=on
;FrustumCulling=on

; resizes window to a small window 
[Windowed]
WindowWidth = 800;
WindowHeight = 600;

; This is relative to the Assets directory
WindowIconImage=FlingEngineLogo.png

; Graphics API Settings
[Vulkan]
EnableValidationLayers=false
#EnableValidationLayers=true

[Graphics]
; Cube map folder for the skybox, relative to the Assets directory. Leave empty for no skybox.
; @see Cubemap.h for the face file names
Skybox=Textures/Skybox/Garden

[Camera]
MoveSpeed=10
RotationSpeed=700

[Imgui]
display=true

; Game settings!
[Game]

; Start level is relative to the assets directory
; @see World::LoadLevel
StartLevel=Levels/EmptyLevel.json
WindowIcon=Icons/Fling_Logo.png

; Localization: string tables for DisplayText. See Plans/strings.md
[Localization]
; Folder of string tables, relative to the Assets directory. One folder per language.
Folder=Localization
; The language that has every key
SourceLanguage=en
; The language to show text in. --language overrides it.
Language=en

; Physics settings
[Physics]

; Worker threads that help with each physics step. The game thread waits for them
; (fork and join). 0 runs the whole step on the game thread. The simulation
; result is the same for any value.
WorkerThreads=0
