; Core engine config example
[Engine]
WindowWidth=1920
WindowHeight=1080
; The text shown in the window title bar! 
WindowTitle=Fling Engine
; Will show what git branch and commit head in the title bar
DisplayBuildInfoInTitle=true
DisplayVersionInfoInTitle=true

; resizes window to a small window 
[Windowed]
WindowWidth = 800;
WindowHeight = 600;

; This is relative to the Assets directory
WindowIconImage=FlingEngineLogo.png

; Graphics API Settings
[Vulkan]
EnableValidationLayers=false
#EnableValidationLayers=true

[Graphics]
; Cube map folder for the skybox, relative to the Assets directory. Leave empty for no skybox.
; @see Cubemap.h for the face file names
Skybox=Textures/Skybox/Garden

[Camera]
MoveSpeed=10
RotationSpeed=700

[Imgui]
display=true

; Game settings!
[Game]

; Start level is relative to the assets directory
; @see World::LoadLevel
StartLevel=Levels/EmptyLevel.json
WindowIcon=Icons/Fling_Logo.png

; Physics settings
[Physics]

; Worker threads that help with each physics step. The game thread waits for them
; (fork and join). 0 runs the whole step on the game thread. The simulation
; result is the same for any value.
WorkerThreads=0
