name: Build

on:
  workflow_dispatch:

jobs:
  diag:
    name: Diagnose DynamicLibrary hang (VS 2026)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.357.0
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build and install Catch2
        shell: bash
        run: |
          cmake -DFLING_INIT_CONFIGS=Debug \
            -DFLING_INIT_SKIP_SUBMODULES=ON -DFLING_INIT_SKIP_CONFIGURE=ON \
            -P scripts/init.cmake

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DDEFINE_SHIPPING=OFF -DENABLE_MULTICORE=ON

      - name: Build CoreTests
        run: cmake --build build --config Debug --target CoreTests --parallel

      - name: Run variants with a timeout
        shell: bash
        run: |
          set +e
          EXE=$(find build -name CoreTests.exe | head -1)
          ctest --version | head -1
          procs() { tasklist //FO CSV //NH | cut -d, -f1 | sort | uniq > "$1"; }
          run() {
            local LABEL="$1"; shift
            procs before.txt
            START=$(date +%s)
            timeout 60 bash -c "$*" > out.txt 2>&1
            RC=$?
            echo "=== [$LABEL] rc=$RC time=$(( $(date +%s) - START ))s"
            tail -15 out.txt
            procs after.txt
            echo "--- new processes:"; comm -13 before.txt after.txt
          }
          run "pipe stdout" "'$EXE' DynamicLibrary -s | cat"
          run "pipe, stdin null" "'$EXE' DynamicLibrary -s < /dev/null | cat"
          run "ctest -V" "ctest --test-dir build -C Debug -R '^DynamicLibrary\$' -V --timeout 40"
          for S in "An unsigned absolute path is rejected" "A bare name does not search the current directory" "Open and call a symbol"; do
            run "pipe: $S" "'$EXE' DynamicLibrary -c '$S' -s | cat"
          done

      - name: Environment info
        if: always()
        shell: pwsh
        run: |
          Get-Service CryptSvc, WinDefend -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object RealTimeProtectionEnabled, AMServiceEnabled
          [Environment]::OSVersion
