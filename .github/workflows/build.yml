name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one toolchain failing must not hide the others
      matrix:
        include:
          - name: Linux GCC Release
            os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
          - name: Linux Clang Release
            os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: Release
          # Shipping turns FLING_BUILD_TESTS off by default. This job does not
          # install Catch2, to prove that a shipping build does not need it.
          - name: Linux GCC Shipping
            os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
            shipping: true
          - name: Windows MSVC Debug
            os: windows-2022
            compiler: msvc
            build_type: Debug
          - name: Windows MSVC Release
            os: windows-2022
            compiler: msvc
            build_type: Release
          - name: Windows MSYS2 UCRT64 Release
            os: windows-2022
            compiler: mingw
            build_type: Release

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # ---------- system dependencies ----------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            xorg-dev libx11-dev libwayland-dev libxkbcommon-dev libglu1-mesa-dev \
            libvulkan-dev glslang-tools

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.compiler != 'mingw'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.357.0
          install_runtime: true
          cache: true
          stripdown: true

      - name: Setup MSYS2 (UCRT64)
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-glslang

      # ---------- Catch2 (needed by find_package(Catch2 3 REQUIRED)) ----------
      # Same script as Init.sh / Init.bat, so CI keeps it working. It installs to
      # external/Catch2/install, where the root CMakeLists.txt already looks.
      # Checkout already pulled the submodules.
      - name: Build and install Catch2
        if: matrix.compiler != 'mingw' && !matrix.shipping
        shell: bash
        run: |
          cmake -DFLING_INIT_CONFIGS=${{ matrix.build_type }} \
            -DFLING_INIT_SKIP_SUBMODULES=ON -DFLING_INIT_SKIP_CONFIGURE=ON \
            -P scripts/init.cmake

      - name: Build and install Catch2 (UCRT64)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          cmake -DFLING_INIT_CONFIGS=${{ matrix.build_type }} \
            -DFLING_INIT_SKIP_SUBMODULES=ON -DFLING_INIT_SKIP_CONFIGURE=ON \
            -P scripts/init.cmake

      # ---------- configure + build ----------
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDEFINE_SHIPPING=${{ matrix.shipping && 'ON' || 'OFF' }} \
            ${{ matrix.shipping && '-DCMAKE_DISABLE_FIND_PACKAGE_Catch2=ON' || '' }}

      - name: Configure (Windows)
        if: runner.os == 'Windows' && matrix.compiler != 'mingw'
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DDEFINE_SHIPPING=OFF `
            -DENABLE_MULTICORE=ON

      - name: Configure (UCRT64)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDEFINE_SHIPPING=OFF

      - name: Build
        if: matrix.compiler != 'mingw'
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Build (UCRT64)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: cmake --build build --parallel

      # ---------- run tests ----------
      # --no-tests=error fails the job if no tests are registered with CTest.
      # --timeout fails a hung test instead of letting the job run for hours.
      # -C is needed by Visual Studio (multi-config) and ignored by Ninja.
      - name: Run tests
        if: matrix.compiler != 'mingw' && !matrix.shipping
        shell: bash
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --no-tests=error --timeout 300

      - name: Run tests (UCRT64)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 300

  # Runs the first-time setup the way a new contributor would: Init.sh / Init.bat
  # on a clone without submodules, then a build and the tests. The build job
  # above configures by hand, so this is what keeps the wrappers working.
  fresh-clone:
    name: Fresh clone (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Init.sh
            os: ubuntu-24.04
          - name: Windows Init.bat
            os: windows-2022
    steps:
      # No submodules: pulling them is part of what Init does
      - uses: actions/checkout@v5

      # Same container as scripts/fresh-clone-test/Dockerfile describes for local use
      - name: Init.sh, build, and test in a clean container
        if: runner.os == 'Linux'
        run: |
          docker build -t fling-fresh-clone scripts/fresh-clone-test
          docker run --rm -v "$PWD:/src:ro" fling-fresh-clone

      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.357.0
          install_runtime: true
          cache: true
          stripdown: true

      - name: Init.bat
        if: runner.os == 'Windows'
        shell: cmd
        run: Init.bat

      - name: Build
        if: runner.os == 'Windows'
        run: cmake --build build --config Debug --parallel

      - name: Run tests
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error --timeout 300

  # Doc-comment conventions for first-party sources (see Skills/coding-style.md / issue #166).
  # clang-format cannot enforce comment *content*; this script does.
  comment-style:
    name: Comment style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check documentation comment style
        run: python3 scripts/check_comment_style.py
