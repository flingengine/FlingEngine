name: Build

on:
  workflow_dispatch:

jobs:
  diag:
    name: Diagnose DynamicLibrary hang (VS 2026)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.357.0
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build and install Catch2
        shell: bash
        run: |
          cmake -DFLING_INIT_CONFIGS=Debug \
            -DFLING_INIT_SKIP_SUBMODULES=ON -DFLING_INIT_SKIP_CONFIGURE=ON \
            -P scripts/init.cmake

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DDEFINE_SHIPPING=OFF -DENABLE_MULTICORE=ON

      - name: Build CoreTests
        run: cmake --build build --config Debug --target CoreTests --parallel

      - name: Run variants with a timeout
        shell: bash
        run: |
          EXE=$(find build -name CoreTests.exe | head -1)
          run() {
            local LABEL="$1"; shift
            START=$(date +%s)
            timeout 120 "$@" > out.txt 2>&1
            RC=$?
            echo "=== [$LABEL] rc=$RC time=$(( $(date +%s) - START ))s"
            if [ $RC -ne 0 ]; then tail -25 out.txt; fi
          }
          run "whole case from repo root" "$EXE" DynamicLibrary -s
          run "whole case, durations" "$EXE" DynamicLibrary -d yes
          run "all CoreTests" "$EXE"
          run "ctest -R DynamicLibrary" ctest --test-dir build -C Debug -R "^DynamicLibrary$" --output-on-failure -V
          run "ctest first 9" ctest --test-dir build -C Debug -I 1,9 --output-on-failure

      - name: Environment info
        if: always()
        shell: pwsh
        run: |
          Get-Service CryptSvc, WinDefend -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object RealTimeProtectionEnabled, AMServiceEnabled
          [Environment]::OSVersion
